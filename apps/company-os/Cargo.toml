[package]
name = "company-os"
version = "0.2.0"
edition = "2021"

[dependencies]
agent-runtime = { path = "../../crates/agent-runtime" }
affiliate-intelligence = { path = "../../crates/affiliate-intelligence" }
affiliate-attribution = { path = "../../crates/affiliate-attribution" }
company-execution = { path = "../../crates/company-execution" }
publishing-contract = { path = "../../crates/publishing-contract" }
company-store = { path = "../../crates/company-store" }
commercial-sales = { path = "../../crates/commercial-sales" }
axum = "0.8"
economic-core = { path = "../../crates/economic-core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync", "time"] }
time = "0.3"
uuid = { version = "1", features = ["v4"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt", "json"] }
