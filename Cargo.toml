[workspace]
resolver = "2"
members = [
  "apps/company-os",
  "apps/media-worker",
  "crates/economic-core",
  "crates/agent-runtime",
  "crates/company-simulator",
  "crates/company-store",
  "crates/company-domain",
  "crates/company-execution",
  "crates/affiliate-intelligence",
  "crates/affiliate-attribution",
  "crates/media-pipeline",
  "crates/company-organization",
  "crates/publishing-contract",
  "crates/social-publishing",
  "apps/llm-web-relay",
  "apps/llm-web-worker",
  "apps/outbox-worker",
  "crates/commercial-sales",
  "crates/company-experiments",
  "crates/company-learning",
  "crates/company-content",
  "crates/company-growth",
  "crates/company-live-attention",
  "crates/company-compliance",
  "crates/company-command-center",
  "crates/company-agent-evaluation"
]

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "abort"
strip = "symbols"

[profile.dev]
debug = 1
