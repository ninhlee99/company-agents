services:
  company-os:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/company_agents
      COMPANY_ID: ${COMPANY_ID:-00000000-0000-0000-0000-000000000001}
      COMPANY_NAME: ${COMPANY_NAME:-Demo Company}
      COMPANY_CURRENCY: ${COMPANY_CURRENCY:-USD}
      LLM_PROVIDER: ${LLM_PROVIDER:-ollama}
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://ollama:11434/v1}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-qwen3:4b}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-3.6-flash}
      AGENT_CYCLE_SECONDS: ${AGENT_CYCLE_SECONDS:-300}
      MODEL_TIMEOUT_MS: ${MODEL_TIMEOUT_MS:-15000}
      AWIN_FEED_URL: ${AWIN_FEED_URL:-}
      AWIN_FEED_BEARER: ${AWIN_FEED_BEARER:-}
      AWIN_COUPON_FEED_URL: ${AWIN_COUPON_FEED_URL:-}
      AWIN_COMMISSION_GROUP_RATES_BPS: ${AWIN_COMMISSION_GROUP_RATES_BPS:-DEFAULT:500}
      TIKTOK_APP_KEY: ${TIKTOK_APP_KEY:-}
      TIKTOK_APP_SECRET: ${TIKTOK_APP_SECRET:-}
      TIKTOK_ACCESS_TOKEN: ${TIKTOK_ACCESS_TOKEN:-}
      TIKTOK_SHOP_CIPHER: ${TIKTOK_SHOP_CIPHER:-}
      TIKTOK_API_BASE: ${TIKTOK_API_BASE:-https://open-api.tiktokglobalshop.com}
      TIKTOK_AFFILIATE_SEARCH_PATH: ${TIKTOK_AFFILIATE_SEARCH_PATH:-/affiliate_seller/202405/open_collaborations/products/search}
    depends_on:
      postgres:
        condition: service_healthy
      ollama:
        condition: service_healthy
      ollama-init:
        condition: service_completed_successfully
    restart: unless-stopped

  ollama:
    image: ollama/ollama:latest
    ports:
      - "127.0.0.1:11434:11434"
    volumes:
      - ollama_models:/root/.ollama
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 5s
      retries: 12

  ollama-init:
    image: ollama/ollama:latest
    environment:
      OLLAMA_HOST: http://ollama:11434
      OLLAMA_MODEL: ${OLLAMA_MODEL:-qwen3:4b}
    depends_on:
      ollama:
        condition: service_healthy
    volumes:
      - ollama_models:/root/.ollama
    entrypoint: ["/bin/sh", "-c"]
    command: ["ollama pull \"$OLLAMA_MODEL\""]
    restart: "no"

  postgres:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_DB: company_agents
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - company_agents_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d company_agents"]
      interval: 5s
      timeout: 5s
      retries: 12

  redis:
    image: redis:7-alpine
    ports:
      - "127.0.0.1:6379:6379"

volumes:
  company_agents_pg:
  ollama_models:
