services:
  postgres:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_DB: company_agents
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports: ["5432:5432"]
    volumes: [company_agents_pg:/var/lib/postgresql/data]
  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
volumes:
  company_agents_pg:
