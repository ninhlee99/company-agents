name: compile-diagnostic

on:
  push:
    branches:
      - feat/production-completeness
    paths-ignore:
      - ci/compile-report.txt

permissions:
  contents: write

jobs:
  compile-report:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Capture Rust validation output
        shell: bash
        run: |
          set +e
          cargo fmt --all -- --check > /tmp/fmt.log 2>&1
          fmt_status=$?
          cargo check --workspace > /tmp/check.log 2>&1
          check_status=$?
          {
            echo "# Compile diagnostic"
            echo
            echo "fmt_status=$fmt_status"
            echo "cargo_check_status=$check_status"
            echo
            echo "## cargo fmt"
            cat /tmp/fmt.log
            echo
            echo "## cargo check"
            cat /tmp/check.log
          } > ci/compile-report.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ci/compile-report.txt
          git diff --cached --quiet || git commit -m "ci: record compile diagnostic"
          git push
          if [ "$fmt_status" -ne 0 ] || [ "$check_status" -ne 0 ]; then
            exit 1
          fi
