[package]
name = "affiliate-intelligence"
version = "0.1.0"
edition = "2021"

[dependencies]
async-trait = "0.1"
csv = "1"
hmac = "0.12"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
url = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
