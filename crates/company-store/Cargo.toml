[package]
name = "company-store"
version = "0.1.0"
edition = "2021"

[dependencies]
agent-runtime = { path = "../agent-runtime" }
affiliate-intelligence = { path = "../affiliate-intelligence" }
company-domain = { path = "../company-domain" }
media-pipeline = { path = "../media-pipeline" }
affiliate-attribution = { path = "../affiliate-attribution" }
tokio = { version = "1", features = ["rt-multi-thread", "sync"] }
tokio-postgres = { version = "0.7", features = ["with-serde_json-1", "with-uuid-1"] }
serde_json = "1"
uuid = { version = "1", features = ["v4"] }
