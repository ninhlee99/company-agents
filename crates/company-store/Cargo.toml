[package]
name = "company-store"
version = "0.2.0"
edition = "2021"

[dependencies]
agent-runtime = { path = "../agent-runtime" }
async-trait = "0.1"
company-execution = { path = "../company-execution" }
economic-core = { path = "../economic-core" }
tokio = { version = "1", features = ["rt-multi-thread", "sync", "time"] }
tokio-postgres = { version = "0.7", features = ["with-serde_json-1", "with-uuid-1"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
uuid = { version = "1", features = ["v4"] }
