name: temporary-ci-report
on:
  pull_request:
    types: [synchronize, reopened]
permissions:
  contents: read
  issues: write
  pull-requests: write
jobs:
  report:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Run compile diagnostics
        shell: bash
        run: |
          set +e
          {
            echo '=== FMT ==='
            cargo fmt --all -- --check
            echo FMT_EXIT=$?
            echo '=== CHECK ==='
            cargo check --workspace --all-targets
            echo CHECK_EXIT=$?
          } 2>&1 | tee /tmp/ci-output.log
      - name: Comment diagnostic
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          BODY=$(python3 - <<'PY'
          from pathlib import Path
          s=Path('/tmp/ci-output.log').read_text(errors='replace')
          print('## Temporary CI diagnostic\n\n' + chr(96)*3 + 'text')
          print(s[-50000:])
          print(chr(96)*3)
          PY
          )
          gh api "repos/${{ github.repository }}/issues/${{ github.event.pull_request.number }}/comments" -X POST -f body="$BODY"
