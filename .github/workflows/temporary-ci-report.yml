name: temporary-ci-report
on:
  pull_request:
    types: [synchronize, reopened]
permissions:
  contents: read
jobs:
  report:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Check economic core
        shell: bash
        run: |
          set +e
          cargo check -p economic-core > diagnostic.log 2>&1
          echo CHECK_EXIT=$? >> diagnostic.log
          cargo test -p economic-core -- --nocapture >> diagnostic.log 2>&1
          echo TEST_EXIT=$? >> diagnostic.log
          exit 0
      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: economic-core-diagnostic
          path: diagnostic.log
          if-no-files-found: error
