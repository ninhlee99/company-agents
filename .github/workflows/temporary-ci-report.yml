name: temporary-ci-report
on:
  push:
    branches:
      - feature/company-os-completion
permissions:
  contents: read
  pull-requests: write
jobs:
  report:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Run checks and keep output
        shell: bash
        run: |
          set +e
          {
            echo '=== FMT ==='
            cargo fmt --all -- --check
            echo FMT_EXIT=$?
            echo '=== CHECK ==='
            cargo check --workspace --all-targets
            echo CHECK_EXIT=$?
            echo '=== TEST ==='
            cargo test --workspace --no-fail-fast
            echo TEST_EXIT=$?
            echo '=== CLIPPY ==='
            cargo clippy --workspace --all-targets --all-features -- -D warnings
            echo CLIPPY_EXIT=$?
          } 2>&1 | tee /tmp/ci-output.log
      - name: Comment diagnostic
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          PR=$(gh pr list --repo "${{ github.repository }}" --head "feature/company-os-completion" --json number -q '.[0].number')
          BODY=$(python3 - <<'PY'
          from pathlib import Path
          s=Path('/tmp/ci-output.log').read_text(errors='replace')
          print('## Temporary CI diagnostic\n\n' + chr(96)*3 + 'text')
          print(s[-50000:])
          print(chr(96)*3)
          PY
          )
          gh api "repos/${{ github.repository }}/issues/$PR/comments" -X POST -f body="$BODY"
