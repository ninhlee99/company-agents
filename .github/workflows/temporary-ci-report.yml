name: temporary-ci-report
on:
  pull_request:
    types: [synchronize, reopened]
permissions:
  contents: read
  issues: write
jobs:
  report:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Run compile diagnostics
        shell: bash
        run: |
          set +e
          {
            echo '=== FMT ==='
            cargo fmt --all -- --check
            echo FMT_EXIT=$?
            echo '=== CHECK ==='
            cargo check --workspace --all-targets
            echo CHECK_EXIT=$?
          } 2>&1 | tee /tmp/ci-output.log
      - name: Create temporary issue with diagnostic
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue create --repo "${{ github.repository }}" --title "TEMP-CI-DIAGNOSTIC-${{ github.event.pull_request.number }}" --body-file /tmp/ci-output.log
