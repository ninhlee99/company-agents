name: temporary-pr-diagnostics
on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Capture checks
        shell: bash
        run: |
          set +e
          cargo fmt --all -- --check > /tmp/fmt.log 2>&1
          fmt_status=$?
          cargo check --workspace > /tmp/check.log 2>&1
          check_status=$?
          cargo clippy --workspace --all-targets --all-features -- -D warnings > /tmp/clippy.log 2>&1
          clippy_status=$?
          {
            echo "fmt_status=$fmt_status"
            echo "check_status=$check_status"
            echo "clippy_status=$clippy_status"
            echo
            echo "===== FMT ====="
            cat /tmp/fmt.log
            echo
            echo "===== CHECK ====="
            cat /tmp/check.log
            echo
            echo "===== CLIPPY ====="
            cat /tmp/clippy.log
          } > diagnostic.txt
      - name: Upload diagnostics
        uses: actions/upload-artifact@v4
        with:
          name: temporary-cargo-diagnostics
          path: diagnostic.txt
