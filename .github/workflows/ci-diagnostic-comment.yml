name: ci-diagnostic-comment

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

jobs:
  cargo-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/github-script@v7
        with:
          script: |
            const { execFileSync } = require('child_process');
            let output = '';
            let failed = false;
            try {
              output = execFileSync('cargo', ['check', '--workspace'], {
                encoding: 'utf8',
                stdio: ['ignore', 'pipe', 'pipe'],
              });
            } catch (error) {
              failed = true;
              output = String(error.stdout || '') + '\n' + String(error.stderr || '');
            }
            output = output.slice(-50000);
            const body = [
              '## Temporary CI diagnostic',
              '',
              'BEGIN_LOG',
              output.replace(/\u001b\[[0-9;]*m/g, ''),
              'END_LOG',
            ].join('\n');
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body,
            });
            if (failed) core.setFailed('cargo check --workspace failed; see PR comment');
