name: feature-diagnostics
on:
  push:
    branches:
      - feature/company-os-completion
  pull_request:
permissions:
  contents: read
  actions: read
jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Capture checks
        shell: bash
        run: |
          set +e
          {
            echo '=== RUST VERSION ==='
            rustc --version
            cargo --version
            echo '=== FMT ==='
            cargo fmt --all -- --check
            echo "FMT_EXIT=$?"
            echo '=== CHECK ==='
            cargo check --workspace --all-targets
            echo "CHECK_EXIT=$?"
            echo '=== TEST ==='
            cargo test --workspace --no-fail-fast
            echo "TEST_EXIT=$?"
            echo '=== CLIPPY ==='
            cargo clippy --workspace --all-targets --all-features -- -D warnings
            echo "CLIPPY_EXIT=$?"
          } > diagnostic.log 2>&1
          test -s diagnostic.log
      - uses: actions/upload-artifact@v4
        with:
          name: company-agents-diagnostic
          path: diagnostic.log
          if-no-files-found: error
