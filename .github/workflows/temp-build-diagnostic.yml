name: temp-build-diagnostic
on:
  push:
    branches:
      - feature/company-os-completion-v3
permissions:
  contents: write
jobs:
  diagnostic:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Run diagnostics
        shell: bash
        run: |
          set +e
          cargo fmt --all -- --check > /tmp/fmt.log 2>&1
          FMT=$?
          cargo check --workspace > /tmp/check.log 2>&1
          CHECK=$?
          cargo test --workspace > /tmp/test.log 2>&1
          TEST=$?
          cargo clippy --workspace --all-targets --all-features -- -D warnings > /tmp/clippy.log 2>&1
          CLIPPY=$?
          {
            echo "FMT=$FMT CHECK=$CHECK TEST=$TEST CLIPPY=$CLIPPY"
            echo
            echo '===== FMT ====='
            sed -n '1,250p' /tmp/fmt.log
            echo
            echo '===== CHECK ====='
            sed -n '1,500p' /tmp/check.log
            echo
            echo '===== TEST ====='
            sed -n '1,500p' /tmp/test.log
            echo
            echo '===== CLIPPY ====='
            sed -n '1,500p' /tmp/clippy.log
          } > diagnostics/latest-build.txt
          exit 0
      - name: Commit diagnostics
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add diagnostics/latest-build.txt
          git diff --cached --quiet && exit 0
          git commit -m 'chore: capture temporary build diagnostics'
          git push