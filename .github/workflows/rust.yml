name: rust
on:
  push:
  pull_request:

jobs:
  unit-and-agent:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: bash scripts/lint_infra.sh
      - run: bash scripts/secret_hygiene.sh
      - name: Verify workspace
        env:
          FORMAT_BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
        run: bash scripts/verify.sh

  package-tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        package:
          - economic-core
          - agent-runtime
          - company-execution
          - affiliate-intelligence
          - affiliate-attribution
          - media-pipeline
          - company-organization
          - publishing-contract
          - company-store
          - company-simulator
          - company-os
          - media-worker
          - llm-web-relay
          - llm-web-worker
          - outbox-worker
          - commercial-sales
          - company-growth
          - company-live-attention
          - company-compliance
          - company-command-center
          - company-agent-evaluation
          - company-autonomy
          - company-capital
          - company-safety-controls
          - company-tiktok-auth
          - company-revenue-graph
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test -p ${{ matrix.package }} -- --nocapture

  model-benchmark-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Run deterministic model benchmark smoke
        env:
          LLM_BENCHMARK_PROVIDERS: mock
        run: |
          cargo run -p agent-runtime --bin model-benchmark > model-benchmark.json
          cat model-benchmark.json
      - name: Upload benchmark smoke report
        uses: actions/upload-artifact@v4
        with:
          name: model-benchmark-smoke
          path: model-benchmark.json

  postgres-integration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_DB: company_agents
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d company_agents"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/company_agents
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test -p company-store -- --nocapture

  production-restart-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Run production-like restart/chaos smoke
        run: bash scripts/production_restart_smoke.sh
      - name: Collect compose diagnostics on failure
        if: failure()
        run: |
          docker compose ps
          docker compose logs --no-color company-os postgres outbox-worker || true

  browser-bridge:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compile Python browser bridge
        run: python -m compileall -q apps/llm-web-bridge
      - name: Run offline browser bridge self-test
        env:
          LLM_WEB_BRIDGE_SELF_TEST: "1"
        run: |
          python -m pip install -r apps/llm-web-bridge/requirements.txt
          python apps/llm-web-bridge/bridge.py
