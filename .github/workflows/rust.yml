name: rust
on:
  push:
  pull_request:

jobs:
  unit-and-agent:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Capture cargo check diagnostics
        id: cargo-check
        continue-on-error: true
        shell: bash
        run: |
          set +e
          cargo check --workspace 2>&1 | tee /tmp/cargo-check.log
          echo "status=${PIPESTATUS[0]}" >> "$GITHUB_OUTPUT"
      - name: Upload cargo diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cargo-check-diagnostics
          path: /tmp/cargo-check.log
          if-no-files-found: warn
      - name: Publish cargo diagnostics to PR
        if: always()
        uses: actions/github-script@v7
        env:
          CHECK_STATUS: ${{ steps.cargo-check.outputs.status }}
        with:
          script: |
            const fs = require('fs');
            const raw = fs.existsSync('/tmp/cargo-check.log')
              ? fs.readFileSync('/tmp/cargo-check.log', 'utf8')
              : 'cargo check did not produce a log';
            const bounded = raw.length > 12000 ? raw.slice(-12000) : raw;
            const body = [
              '<!-- compile-diagnostic -->',
              '### Temporary compile diagnostic',
              'cargo check exit status: ' + process.env.CHECK_STATUS,
              '```text',
              bounded,
              '```',
            ].join('\n');
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body,
            });
      - name: Fail on cargo check errors
        if: steps.cargo-check.outputs.status != '0'
        run: exit 1
      - name: Check Rust formatting
        run: cargo fmt --all -- --check
      - run: bash scripts/verify.sh

  postgres-integration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_DB: company_agents
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d company_agents"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/company_agents
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test -p company-store -- --nocapture
