name: rust
on:
  push:
  pull_request:

jobs:
  unit-and-agent:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: bash scripts/lint_infra.sh
      - run: bash scripts/secret_hygiene.sh
      - run: bash scripts/verify.sh

  package-tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        package:
          - economic-core
          - agent-runtime
          - company-execution
          - affiliate-intelligence
          - affiliate-attribution
          - media-pipeline
          - company-organization
          - company-store
          - company-simulator
          - company-os
          - media-worker
          - llm-web-relay
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test -p ${{ matrix.package }} -- --nocapture

  postgres-integration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_DB: company_agents
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d company_agents"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/company_agents
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test -p company-store -- --nocapture
