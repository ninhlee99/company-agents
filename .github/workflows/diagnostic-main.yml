name: diagnostic-main

on:
  push:
    branches:
      - ci/diagnose-main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Smoke
        run: |
          mkdir -p ci-diagnostics
          echo "DIAGNOSTIC_OK" > ci-diagnostics/smoke.txt
          pwd > ci-diagnostics/pwd.txt
          rustc --version > ci-diagnostics/rustc.txt
      - name: Upload
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: diagnostic-smoke
          path: ci-diagnostics
